<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Buy Desk settings</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Buy Desk settings: a Telegram Mini App. A static page holding no data: current settings come in on the URL (?s=),
   Save sends them back to the bot as a chat message (Telegram.WebApp.sendData). Colours come from Telegram's theme. */
:root {
  --bg: var(--tg-theme-secondary-bg-color, #f1f1f4);
  --section: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --ink: var(--tg-theme-text-color, #000000);
  --hint: var(--tg-theme-hint-color, #8e8e93);
  --link: var(--tg-theme-link-color, #2481cc);
  --btn: var(--tg-theme-button-color, #3390ec);
  --btn-ink: var(--tg-theme-button-text-color, #ffffff);
  --sep: var(--tg-theme-section-separator-color, rgba(128,128,128,.22));
  --warn: #e0a106; --good: #31a24c; --bad: var(--tg-theme-destructive-text-color, #e5484d);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* the fallback bar hides inside Telegram (WoZ 26 Nov: two Continue buttons showed) */
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; }
main { padding: 14px max(14px, env(safe-area-inset-left)) 110px max(14px, env(safe-area-inset-right)); display: grid; gap: 18px; max-width: 560px; margin: 0 auto; }
h1 { margin: 0; font-size: 22px; line-height: 1.2; }
.lead { margin: 4px 0 0; color: var(--hint); font-size: 14px; }
.steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.steps i { height: 3px; border-radius: 2px; background: var(--sep); }
.steps i.on { background: var(--btn); }
.stepname { font-size: 12.5px; color: var(--hint); margin-top: 6px; }
.group { display: grid; gap: 6px; }
.cap { font-size: 12.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--hint); padding: 0 14px; }
.foot { font-size: 12.5px; color: var(--hint); padding: 0 14px; }
.list { background: var(--section); border-radius: 12px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; min-height: 46px; border-top: 1px solid var(--sep); }
.item:first-child { border-top: 0; }
.lab { flex: 1; min-width: 0; }
.lab small { display: block; color: var(--hint); font-size: 12.5px; }
.val { color: var(--hint); }
button.item { width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; }
button.item:first-child { border-top: 0; }
button.item::after { content: "›"; color: var(--hint); font-size: 20px; line-height: 1; }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--bg); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--section); box-shadow: 0 1px 2px rgba(0,0,0,.15); font-weight: 600; }
.stepper { display: inline-flex; align-items: center; border-radius: 8px; overflow: hidden; border: 1px solid var(--sep); }
.stepper button { width: 34px; height: 32px; border: 0; background: var(--bg); font-size: 18px; cursor: pointer; color: var(--btn); }
.stepper output { min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.switch { position: relative; width: 50px; height: 30px; border-radius: 15px; background: var(--sep); border: 0; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .2s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { left: 22px; }
input[type="number"], input[type="text"], select { border: 1px solid var(--sep); border-radius: 8px; padding: 6px 8px; font: inherit; background: var(--section); color: var(--ink); }
input[type="number"] { width: 100px; text-align: right; }
.item.field { flex-wrap: wrap; gap: 6px 10px; }
.item.field .lab { flex: 0 0 auto; }
.item.field input { flex: 1 1 180px; min-width: 0; }
.preview { background: var(--section); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; border: 1px solid var(--sep); }
.big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sub { font-size: 13px; color: var(--hint); }
.calc { font-size: 13px; display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; font-variant-numeric: tabular-nums; }
.calc span:nth-child(odd) { color: var(--hint); }
.warntext { color: var(--warn); font-weight: 600; }
.linky { color: var(--link); }
.fallback { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(14px, env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--sep); display: grid; gap: 6px; }
.fallback button { border: 0; border-radius: 12px; padding: 14px; font-weight: 600; background: var(--btn); color: var(--btn-ink); cursor: pointer; }
.fallback .sec { background: transparent; color: var(--link); padding: 6px; font-weight: 500; }
.note { font-size: 13px; color: var(--hint); }
</style>
</head>
<body>
<main id="app"></main>
<div class="fallback" id="fb" hidden><button type="button" id="fb-main">Continue</button><button type="button" class="sec" id="fb-back">Back</button></div>
<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTg = !!(tg && tg.initData !== undefined && tg.platform && tg.platform !== 'unknown');
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  const app = document.getElementById('app');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const gbp = (n) => '£' + (Math.round(n * 100) / 100).toFixed(2);
  const haptic = (k) => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} };

  // ---- settings in: ?s=<base64url JSON>, mode: ?m=wizard|settings ----
  const DEF = { v: 1, vat: true, prep: 0.5, minProfit: 3, minRoi: 15,
    suppliers: [{ name: 'EU wholesaler', disc: 0, ship: 'pallet', freight: 0, units: 400, origin: true },
                { name: 'UK distributor', disc: 0, ship: 'parcel', freight: 0, units: 1, origin: true }],
    maxPrice: 65, maxSellers: 10, amazon: 'avoid', perDay: 3, time: '08:00', kinds: { buy: true, stop: true, restock: false } };
  const q = new URLSearchParams(location.search);
  let S;
  try { S = Object.assign({}, DEF, JSON.parse(decodeURIComponent(escape(atob((q.get('s') || '').replace(/-/g, '+').replace(/_/g, '/')))))); }
  catch (e) { S = JSON.parse(JSON.stringify(DEF)); }
  let mode = q.get('m') === 'settings' ? 'settings' : 'wizard', step = 0, page = null, sup = 0, back = [];
  const WZ = ['Your account', 'Your profit bar', 'Your suppliers', 'What you sell', 'Alerts', 'Check and save'];

  function landed(sp) { const per = sp.ship === 'pallet' ? (sp.freight || 0) / Math.max(1, sp.units) : (sp.freight || 0); return { per, duty: sp.origin ? 0 : 2 }; }
  function maxBuy(p) { const ex = p / 1.2, ref = p * 0.15, fba = 2.7, net = ex - ref - fba - S.prep; return { ex, ref, fba, net, max: Math.min(net - S.minProfit, net / (1 + S.minRoi / 100)) }; }
  const sw = (on, act) => `<button type="button" class="switch" role="switch" aria-checked="${on}" data-act="${act}"></button>`;
  const seg = (opts, cur, act) => `<span class="seg">${opts.map(([v, l]) => `<button type="button" aria-pressed="${v === cur}" data-act="${act}" data-v="${v}">${esc(l)}</button>`).join('')}</span>`;
  const stp = (val, act, fmt) => `<span class="stepper"><button type="button" aria-label="less" data-act="${act}" data-d="-1">−</button><output>${fmt(val)}</output><button type="button" aria-label="more" data-act="${act}" data-d="1">+</button></span>`;
  const STEP = { prep: [0.05, 0, 5], minProfit: [0.5, 0, 20], minRoi: [1, 0, 100], disc: [1, 0, 60], maxPrice: [5, 5, 500], maxSellers: [1, 1, 40], perDay: [1, 0, 10] };

  function barPreview() {
    const m = maxBuy(20);
    return `<div class="preview"><span class="sub">What this means for a £20 item</span><span class="big">Buy at ${gbp(Math.max(0, m.max))} or less</span>
      <div class="calc"><span>Sale price ex VAT</span><span>${gbp(m.ex)}</span><span>Amazon referral (15%)</span><span>−${gbp(m.ref)}</span><span>Amazon FBA fee</span><span>−${gbp(m.fba)}</span><span>Prep</span><span>−${gbp(S.prep)}</span><span>Left for stock</span><span>${gbp(m.net)}</span></div>
      <span class="sub">Example fees. Real answers use each product's own fees.</span></div>`;
  }
  const P = {
    account: () => `<div><h1>Your account</h1><p class="lead">Filled in from what we know. Fix anything that's wrong.</p></div>
      <div class="group"><span class="cap">Amazon</span><div class="list">
        <div class="item"><span class="lab">VAT registered<small>Your stock cost is ex VAT</small></span>${sw(S.vat, 'vat')}</div>
        <div class="item"><span class="lab">Selling plan</span><span class="val">Professional</span></div>
        <div class="item"><span class="lab">Fulfilment</span><span class="val">FBA via prep centre</span></div></div></div>
      <div class="group"><span class="cap">Prep centre</span><div class="list">
        <div class="item"><span class="lab">Per single unit<small>label and bag</small></span>${stp(S.prep, 'prep', gbp)}</div></div></div>`,
    bar: () => `<div><h1>Your profit bar</h1><p class="lead">The least you'll accept on a line. Both must be met.</p></div>
      <div class="group"><div class="list">
        <div class="item"><span class="lab">Minimum profit<small>per unit, after every cost</small></span>${stp(S.minProfit, 'minProfit', gbp)}</div>
        <div class="item"><span class="lab">Minimum return<small>profit ÷ what you paid</small></span>${stp(S.minRoi, 'minRoi', (v) => v + '%')}</div>
      </div><span class="foot">Many UK wholesale sellers use £2–3 and 15–30%.</span></div>${barPreview()}`,
    suppliers: () => `<div><h1>Your suppliers</h1><p class="lead">Your price from each one, and what it costs to get stock to your prep centre.</p></div>
      <div class="group"><div class="list">${S.suppliers.map((sp, i) => { const l = landed(sp); return `<button type="button" class="item" data-act="sup" data-i="${i}"><span class="lab">${esc(sp.name)}<small>${sp.disc}% off list · ${sp.freight ? 'freight ' + gbp(l.per) + ' a unit' : '<span class="warntext">freight not set</span>'}</small></span></button>`; }).join('')}
        <button type="button" class="item" data-act="addsup"><span class="lab linky">+ Add a supplier</span></button></div>
      <span class="foot">Missing freight is fine: answers will say "holds if freight stays under £x".</span></div>`,
    supplier: () => { const sp = S.suppliers[sup], l = landed(sp); return `<div><h1>${esc(sp.name)}</h1><p class="lead">Used for every line on this supplier's lists.</p></div>
      <div class="group"><span class="cap">Supplier</span><div class="list"><div class="item field"><label class="lab" for="nm">Name</label><input type="text" id="nm" value="${esc(sp.name)}" maxlength="40" data-act="name"></div></div></div>
      <div class="group"><span class="cap">Your price</span><div class="list"><div class="item"><span class="lab">Discount off their list</span>${stp(sp.disc, 'disc', (v) => v + '%')}</div></div></div>
      <div class="group"><span class="cap">Getting it here</span><div class="list">
        <div class="item"><span class="lab">Ships by</span>${seg([['pallet', 'Pallet'], ['parcel', 'Parcel']], sp.ship, 'ship')}</div>
        <div class="item"><span class="lab">${sp.ship === 'pallet' ? 'Freight per pallet' : 'Freight per unit'}<small>door to prep centre, incl. customs broker</small></span><input type="number" id="fr" min="0" value="${sp.freight || ''}" placeholder="£" data-act="freight"></div>
        ${sp.ship === 'pallet' ? `<div class="item"><span class="lab">Units per pallet<small>roughly</small></span><input type="number" id="un" min="1" value="${sp.units}" data-act="units"></div>` : ''}
        <div class="item"><span class="lab">EU origin proof on invoices<small>0% duty with it, 2% on many lines without</small></span>${sw(sp.origin, 'origin')}</div></div></div>
      <div class="preview"><span class="sub">Adds to each unit's cost</span><span class="big">${sp.freight ? gbp(l.per) : 'not set'}${l.duty ? ' + ' + l.duty + '% duty' : ''}</span></div>`; },
    sell: () => `<div><h1>What you sell</h1><p class="lead">Lines outside these are never sent to you.</p></div>
      <div class="group"><div class="list">
        <div class="item"><span class="lab">Highest Amazon price</span>${stp(S.maxPrice, 'maxPrice', (v) => '£' + v)}</div>
        <div class="item"><span class="lab">Most sellers on a listing</span>${stp(S.maxSellers, 'maxSellers', (v) => v)}</div>
        <div class="item"><span class="lab">Amazon on the listing</span>${seg([['avoid', 'Avoid'], ['some', 'If it shares'], ['any', 'Any']], S.amazon, 'amazon')}</div>
      </div><span class="foot">"If it shares" keeps listings where Amazon wins under half the time.</span></div>`,
    alerts: () => `<div><h1>Alerts</h1><p class="lead">How often I message you. Only checked lines.</p></div>
      <div class="group"><div class="list">
        <div class="item"><span class="lab">Most a day</span>${stp(S.perDay, 'perDay', (v) => v)}</div>
        <div class="item"><span class="lab">Send at</span><select id="tm" data-act="time">${['07:00', '08:00', '09:00', '12:00', '18:00'].map((t) => `<option ${t === S.time ? 'selected' : ''}>${t}</option>`).join('')}</select></div></div></div>
      <div class="group"><span class="cap">Tell me when</span><div class="list">
        <div class="item"><span class="lab">A line becomes worth buying</span>${sw(S.kinds.buy, 'k-buy')}</div>
        <div class="item"><span class="lab">A line I sent is no longer profitable</span>${sw(S.kinds.stop, 'k-stop')}</div>
        <div class="item"><span class="lab">One of your lines needs restocking<small>needs your Amazon account connected</small></span>${sw(S.kinds.restock, 'k-restock')}</div></div></div>`,
    review: () => { const l = landed(S.suppliers[0]); return `<div><h1>Check and save</h1><p class="lead">This is what I'll use. Tap a row to change it.</p></div>
      <div class="group"><div class="list">
        <button type="button" class="item" data-act="go" data-s="1"><span class="lab">Profit bar<small>${gbp(S.minProfit)} and ${S.minRoi}%</small></span></button>
        <button type="button" class="item" data-act="go" data-s="2"><span class="lab">Suppliers<small>${S.suppliers.length} · ${esc(S.suppliers[0].name)}: freight ${S.suppliers[0].freight ? gbp(l.per) + ' a unit' : 'not set'}</small></span></button>
        <button type="button" class="item" data-act="go" data-s="3"><span class="lab">What you sell<small>up to £${S.maxPrice} · ≤${S.maxSellers} sellers · Amazon: ${S.amazon}</small></span></button>
        <button type="button" class="item" data-act="go" data-s="4"><span class="lab">Alerts<small>up to ${S.perDay} a day at ${S.time}</small></span></button></div></div>${barPreview()}`; },
    home: () => { const l = landed(S.suppliers[0]); return `<div><h1>Settings</h1></div>
      <div class="group"><span class="cap">Money</span><div class="list">
        <button type="button" class="item" data-act="open" data-p="bar"><span class="lab">Profit bar<small>${gbp(S.minProfit)} and ${S.minRoi}%</small></span></button>
        <button type="button" class="item" data-act="open" data-p="account"><span class="lab">Account and prep<small>VAT ${S.vat ? 'registered' : 'not registered'} · prep ${gbp(S.prep)}</small></span></button></div></div>
      <div class="group"><span class="cap">Suppliers</span><div class="list"><button type="button" class="item" data-act="open" data-p="suppliers"><span class="lab">${S.suppliers.length} suppliers<small>${esc(S.suppliers[0].name)} freight ${S.suppliers[0].freight ? gbp(l.per) + ' a unit' : 'not set'}</small></span></button></div></div>
      <div class="group"><span class="cap">Filters and alerts</span><div class="list">
        <button type="button" class="item" data-act="open" data-p="sell"><span class="lab">What you sell<small>up to £${S.maxPrice} · ≤${S.maxSellers} sellers</small></span></button>
        <button type="button" class="item" data-act="open" data-p="alerts"><span class="lab">Alerts<small>up to ${S.perDay} a day at ${S.time}</small></span></button></div></div>
      <span class="foot">Your settings travel only inside Telegram, to the Buy Desk bot.</span>`; }
  };
  const WZP = ['account', 'bar', 'suppliers', 'sell', 'alerts', 'review'];

  function current() { return page || (mode === 'wizard' ? WZP[step] : 'home'); }
  function mainLabel() { if (page) return 'Done'; if (mode === 'wizard') return step === WZ.length - 1 ? 'Save' : 'Continue'; return 'Save'; }
  function render() {
    const name = current();
    const head = mode === 'wizard' && !page ? `<div><div class="steps">${WZ.map((_, k) => `<i class="${k <= step ? 'on' : ''}"></i>`).join('')}</div><div class="stepname">Step ${step + 1} of ${WZ.length} · ${WZ[step]}</div></div>` : '';
    app.innerHTML = head + P[name]() + (inTg ? '' : '<p class="note">Open this from ⚙️ Settings in the Buy Desk bot to save. Here it is a preview only.</p>');
    const showBack = !!page || (mode === 'wizard' && step > 0);
    if (inTg) {
      tg.MainButton.setText(mainLabel()); tg.MainButton.show();
      showBack ? tg.BackButton.show() : tg.BackButton.hide();
    } else {
      document.getElementById('fb').hidden = false;
      document.getElementById('fb-main').textContent = mainLabel();
      document.getElementById('fb-back').hidden = !showBack;
    }
    window.scrollTo(0, 0);
  }
  function onMain() {
    if (page) { page = back.pop() || null; render(); return; }
    if (mode === 'wizard' && step < WZ.length - 1) { step++; render(); return; }
    save();
  }
  function onBack() {
    if (page) { page = back.pop() || null; render(); return; }
    if (mode === 'wizard' && step > 0) { step--; render(); }
  }
  function save() {
    const out = JSON.stringify({ t: 'settings', s: S });
    if (inTg) { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} tg.sendData(out); }
    else { app.insertAdjacentHTML('beforeend', '<p class="note">Saved (preview only: nothing was sent).</p>'); }
  }
  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act, sp = S.suppliers[sup];
    if (b.dataset.d && STEP[a]) { const [inc, lo, hi] = STEP[a]; const t = a === 'disc' ? sp : S; t[a] = Math.min(hi, Math.max(lo, Math.round((t[a] + inc * Number(b.dataset.d)) * 100) / 100)); haptic(); render(); return; }
    if (a === 'vat') S.vat = !S.vat;
    else if (a === 'origin') sp.origin = !sp.origin;
    else if (a.startsWith('k-')) S.kinds[a.slice(2)] = !S.kinds[a.slice(2)];
    else if (a === 'ship') sp.ship = b.dataset.v;
    else if (a === 'amazon') S.amazon = b.dataset.v;
    else if (a === 'sup') { back.push(page); sup = Number(b.dataset.i); page = 'supplier'; }
    else if (a === 'addsup') { S.suppliers.push({ name: 'New supplier', disc: 0, ship: 'parcel', freight: 0, units: 1, origin: true }); back.push(page); sup = S.suppliers.length - 1; page = 'supplier'; }
    else if (a === 'go') { step = Number(b.dataset.s); }
    else if (a === 'open') { back.push(page); page = b.dataset.p; }
    else return;
    haptic(); render();
  });
  app.addEventListener('change', (e) => {
    const el = e.target, a = el.dataset.act, sp = S.suppliers[sup];
    if (a === 'name') sp.name = el.value.trim() || 'Unnamed supplier';
    else if (a === 'freight') sp.freight = Math.max(0, Number(el.value) || 0);
    else if (a === 'units') sp.units = Math.max(1, Number(el.value) || 1);
    else if (a === 'time') S.time = el.value;
    else return;
    render();
  });
  if (inTg) { tg.MainButton.onClick(onMain); tg.BackButton.onClick(onBack); }
  else { document.getElementById('fb-main').addEventListener('click', onMain); document.getElementById('fb-back').addEventListener('click', onBack); }
  render();
})();
</script>
</body>
</html>
